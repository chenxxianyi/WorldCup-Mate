redConfigs()')\nio.open(p,'w',encoding='utf-8',newline='').write(s)\nprint('OK')\n\"", "Bash=cd /d/project/WorldCup-Mate/frontend && python - <<'EOF'\n# -*- coding: utf-8 -*-\nimport io\np = 'src/pages/admin/AdminFeaturedPage.vue'\ns = io.open(p, encoding='utf-8').read()\nold = u\"\"\"const selectedConfig = computed(() =>\n  configs.value.find((c) => competitions.value.find((x) => x.id === c.competition_id)?.code === selectedCode.value),\n)\n\"\"\"\nassert s.count(old) == 1\ns = s.replace(old, '')\ns = s.replace(u\"\"\"import { computed, onMounted, ref, watch } from 'vue'\"\"\", u\"\"\"import { onMounted, ref, watch } from 'vue'\"\"\")\nio.open(p, 'w', encoding='utf-8', newline='').write(s)\nprint('OK')\nEOF\nnpx eslint src/pages/admin/AdminFeaturedPage.vue 2>&1 | grep -cE \"warning|error\"; npm run lint 2>&1 | grep problems | tail -1", "Bash=cd /d/project/WorldCup-Mate && cat >> \"项目全面优化任务拆分与开发计划.md\" <<'EOF'\n\n---\n\n## 追加需求（2026-08-05）：后台可配置焦点赛事（比赛 + 文字）\n\n**背景**：前台首页焦点区（宣传语/描述/阶段标签/焦点比赛）原为前端静态主题数据 + 自动取第一场未结束比赛，无法运营配置。\n\n**设计**：新增 `featured_configs` 表（每赛事一条）——`match_id`（指定焦点比赛，可空=自动）、`tagline`/`description`/`stage_label`（宣传文字）、`enabled`。\n\n**已交付（✅）**：\n1. 后端：`FeaturedConfig` 模型 + AutoMigrate；seed 为 5 大联赛预置默认文案（前台无感升级）；API——公开 `GET /api/featured`（按 code 返回启用配置）、admin `GET/PUT /api/admin/featured/:code`（upsert + 审计 + **焦点比赛必须属于该赛事** 校验）、`GET /api/admin/featured/:code/matches`（焦点比赛选择器数据，按赛季过滤）。\n2. 前端：`useLeagueThemeStore` 新增 `currentCopy`（后端配置优先、静态主题兜底）+ `initialize` 并行拉取；HomePage 焦点区文字改用 `currentCopy`，**焦点比赛优先用后台指定的 match_id**（找不到则回落自动逻辑）；新增管理页 `AdminFeaturedPage.vue`（`/admin/featured`，侧边栏\"焦点管理\"）：赛事切换 + 焦点比赛下拉 + 宣传语/副文案/阶段标签表单 + 启用开关 + 前台预览卡。\n3. 测试：`TestFeaturedConfigFlow`（upsert/公开暴露/选择器/跨赛事 match 400/禁用后公开消失）；前端 typecheck/lint(0 errors)/build/44 测试全绿；后端 5 包全绿。\n4. Review（sa_20260805_065858）通过。\nEOF\necho DONE"]
