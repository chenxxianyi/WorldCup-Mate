  new MutationObserver(function(){
    var hs=document.querySelectorAll('h2');
    for(var i=0;i<hs.length;i++){
      if(hs[i].textContent.includes('未登录')){
        hs[i].style.cssText='color:var(--primary);cursor:pointer;text-decoration:underline';
        hs[i].textContent='未登录 · 点击登录';
        hs[i].onclick=function(){location.href='/login'};
      }
    }
  }).observe(document.body||document.documentElement,{childList:true,subtree:true});
}();
